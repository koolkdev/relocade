[package]
name = "relocade-dos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "relocade-dos"
path = "src/main.rs"

[dependencies]
relocade-app = { path = "../../crates/app", features = ["graphics"] }
relocade-dos = { path = "../../crates/dos" }
relocade-machine = { path = "../../crates/machine", features = ["worker"] }
relocade-vga = { path = "../../crates/vga", features = ["renderer"] }
futures-lite = "=2.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "=0.13.2", features = ["xtest"] }
