[package]
name = "relocade-dos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
relocade-app = { path = "../../crates/app", features = ["graphics"] }
relocade-dos = { path = "../../crates/dos" }
relocade-bios = { path = "../../crates/bios" }
relocade-machine = { path = "../../crates/machine", features = ["worker"] }
relocade-renderer = { path = "../../crates/renderer" }
relocade-vga = { path = "../../crates/vga", features = ["renderer"] }
futures-channel = "=0.3.34"
futures-lite = { version = "=2.6.1", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "=0.1.7"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "=0.13.2", features = ["xtest"] }
