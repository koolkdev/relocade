[package]
name = "relocade-dos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
relocade-app = { path = "../../crates/app", features = ["window"] }
relocade-bios = { path = "../../crates/bios" }
relocade-dos = { path = "../../crates/dos" }
relocade-machine = { path = "../../crates/machine" }
relocade-renderer = { path = "../../crates/renderer" }
relocade-vga = { path = "../../crates/vga", features = ["renderer"] }
futures-lite = { version = "=2.6.1", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
wgpu.workspace = true
winit = "=0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "=0.1.7"
