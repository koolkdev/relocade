[package]
name = "relocade-dos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "relocade-dos"
path = "src/main.rs"

[dependencies]
relocade-app = { path = "../../crates/app", features = ["graphics", "audio"] }
relocade-frontend = { path = "../../crates/frontend", features = ["keyboard"] }
relocade-dos = { path = "../../crates/dos", features = ["audio"] }
relocade-machine = { path = "../../crates/machine" }
relocade-vga = { path = "../../crates/vga", features = ["renderer"] }
futures-lite = "=2.6.1"
futures-channel = "=0.3.34"

[dev-dependencies]
async-channel = { version = "=2.5.0", default-features = false }
relocade-clock-test-support = { path = "../../tests/clock-support" }
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "=0.4.79"
wasm-bindgen-test = "=0.3.79"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "=0.13.2", features = ["xtest"] }
