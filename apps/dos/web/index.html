<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relocade DOS</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#ddd;font:16px monospace}
canvas{display:block;width:100%;height:100%;outline:none} #error{white-space:pre-wrap}
</style></head><body><div id="error" role="alert"></div>
<script type="module">
import init, { open, demo } from './pkg/relocade_dos_app.js';
try {
    await init();
    const url = new URLSearchParams(location.search).get('program');
    let program = demo();
    if (url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Program download failed: ${response.status}`);
        program = new Uint8Array(await response.arrayBuffer());
    }
    const control = open(program);
    await control.finished;
} catch (error) {
    document.querySelector('#error').textContent = String(error);
}
</script></body></html>
