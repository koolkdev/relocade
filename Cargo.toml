[workspace]
resolver = "2"
members = ["crates/derive", "crates/compiler", "crates/x86", "crates/x86-profile", "crates/interpreter", "crates/test-support", "crates/machine", "crates/wasm-bindings", "crates/wasm-runtime", "crates/workers", "crates/vfs", "crates/bios", "crates/pc", "crates/dos", "crates/renderer", "crates/frontend", "crates/vga", "crates/pit", "crates/pic", "crates/ps2", "crates/pc-speaker", "tests/browser", "tests/clock-support", "crates/app", "apps/dos"]
default-members = ["crates/compiler", "crates/x86", "crates/machine", "crates/wasm-runtime", "crates/workers", "crates/vfs", "crates/bios", "crates/pc", "crates/dos", "crates/renderer", "crates/vga", "crates/pit", "crates/pic", "crates/ps2", "crates/pc-speaker"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
cpal = "=0.18.2"
relocade-test-support = { path = "crates/test-support" }
wasm-encoder = { version = "=0.254.0", default-features = false }
wasmtime = { version = "=50.0.0-rc.1", default-features = false, features = ["cranelift", "runtime", "std", "threads"] }
wgpu = "=30.0.1"

# Tests construct and compile Wasm at runtime. Keep assertions and debug info,
# but optimize that work, including the Wasmtime compiler dependencies.
[profile.test]
opt-level = 1

# Interpreter fixtures spend most of their generation time in compiler passes.
[profile.test.package.relocade-compiler]
opt-level = 3

# Interpreter generation now runs at startup on cache misses, including dev builds.
[profile.dev.package.relocade-compiler]
opt-level = 1

[profile.dev.package.relocade-x86]
opt-level = 1
