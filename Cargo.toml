[workspace]
resolver = "2"
members = ["crates/compiler", "crates/x86", "crates/test-support", "crates/machine", "crates/runtime", "crates/runtime-wasmtime", "crates/runtime-web", "crates/vfs", "crates/bios", "crates/dos"]
default-members = ["crates/compiler", "crates/x86", "crates/machine", "crates/runtime", "crates/runtime-wasmtime", "crates/vfs", "crates/bios", "crates/dos"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
wasm86-test-support = { path = "crates/test-support" }
wasm-encoder = { version = "=0.254.0", default-features = false }
wasmtime = { version = "=50.0.0-rc.1", default-features = false, features = ["cranelift", "runtime", "std", "threads"] }

# Tests construct and compile Wasm at runtime. Keep assertions and debug info,
# but optimize that work, including the Wasmtime compiler dependencies.
[profile.test]
opt-level = 1
