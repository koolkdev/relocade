[workspace]
resolver = "2"
members = ["crates/derive", "crates/compiler", "crates/x86", "crates/interpreter", "crates/test-support", "crates/machine", "crates/wasm-bindings", "crates/wasm-runtime", "crates/vfs", "crates/bios", "crates/dos", "crates/renderer", "crates/peripherals", "crates/vga", "tests/browser", "crates/app", "apps/dos"]
default-members = ["crates/compiler", "crates/x86", "crates/machine", "crates/wasm-runtime", "crates/vfs", "crates/bios", "crates/dos", "crates/renderer", "crates/vga"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
relocade-test-support = { path = "crates/test-support" }
wasm-encoder = { version = "=0.254.0", default-features = false }
wasmtime = { version = "=50.0.0-rc.1", default-features = false, features = ["cranelift", "runtime", "std", "threads"] }
wgpu = "=30.0.1"

# Tests construct and compile Wasm at runtime. Keep assertions and debug info,
# but optimize that work, including the Wasmtime compiler dependencies.
[profile.test]
opt-level = 1

# Interpreter fixtures spend most of their generation time in compiler passes.
[profile.test.package.relocade-compiler]
opt-level = 3

# The interpreter generator runs as a host build dependency, including cross builds.
[profile.dev.build-override]
opt-level = 1

[profile.release.build-override]
opt-level = 3
