[package]
name = "relocade-dos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
audio = ["dep:cpal", "relocade-pc/audio"]

[dependencies]
async-channel = { version = "=2.5.0", default-features = false }
cpal = { workspace = true, optional = true }
relocade-bios = { path = "../bios" }
relocade-pc = { path = "../pc" }
relocade-pc-speaker = { path = "../pc-speaker" }
relocade-vfs = { path = "../vfs" }
relocade-x86 = { path = "../x86" }
relocade-machine = { path = "../machine" }
relocade-vga = { path = "../vga" }
relocade-frontend = { path = "../frontend", features = ["keyboard", "mouse"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-timer = "=3.0.4"
relocade-ps2 = { path = "../ps2" }
relocade-pic = { path = "../pic" }
pollster = "=1.0.1"
relocade-vga = { path = "../vga", features = ["renderer"] }
wgpu.workspace = true
futures-channel = "=0.3.34"

[dev-dependencies]
relocade-clock-test-support = { path = "../../tests/clock-support" }
