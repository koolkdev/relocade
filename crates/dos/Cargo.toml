[package]
name = "relocade-dos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relocade-bios = { path = "../bios" }
relocade-vfs = { path = "../vfs" }
relocade-x86 = { path = "../x86" }
relocade-machine = { path = "../machine" }
relocade-runtime = { path = "../runtime" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
relocade-runtime-wasmtime = { path = "../runtime-wasmtime" }
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
relocade-runtime-web = { path = "../runtime-web" }
wasm-bindgen-test = "=0.3.79"
