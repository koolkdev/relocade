[package]
name = "relocade-dos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relocade-bios = { path = "../bios" }
relocade-vfs = { path = "../vfs" }
relocade-x86 = { path = "../x86" }
relocade-machine = { path = "../machine" }
relocade-vga = { path = "../vga" }
relocade-peripherals = { path = "../peripherals", features = ["keyboard"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"
relocade-vga = { path = "../vga", features = ["renderer"] }
wgpu.workspace = true
futures-channel = "=0.3.34"
