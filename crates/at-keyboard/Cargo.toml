[package]
name = "relocade-at-keyboard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relocade-machine = { path = "../machine" }
relocade-pic = { path = "../pic" }
relocade-frontend = { path = "../frontend", features = ["keyboard"] }
# Keep shared event listeners safe to poll on the browser main thread.
async-channel = { version = "=2.5.0", default-features = false }
futures-util = "=0.3.34"
