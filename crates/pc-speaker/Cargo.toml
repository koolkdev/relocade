[package]
name = "relocade-pc-speaker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
audio = []

[dependencies]
relocade-pit = { path = "../pit" }
relocade-machine = { path = "../machine" }

[dev-dependencies]
relocade-clock-test-support = { path = "../../tests/clock-support" }
relocade-pic = { path = "../pic" }
relocade-x86 = { path = "../x86" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[[test]]
name = "synthesis"
required-features = ["audio"]
