[package]
name = "relocade-sound-blaster"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
event-listener = { version = "=5.4.1", default-features = false }
futures-lite = { version = "=2.6.1", default-features = false }
relocade-adlib = { path = "../adlib" }
relocade-dma = { path = "../dma" }
relocade-machine = { path = "../machine" }
relocade-pic = { path = "../pic" }

[dev-dependencies]
async-channel = { version = "=2.5.0", default-features = false }
cpal.workspace = true
relocade-clock-test-support = { path = "../../tests/clock-support" }
relocade-mixer = { path = "../mixer" }
relocade-x86 = { path = "../x86" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
