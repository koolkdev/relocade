[package]
name = "relocade-interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relocade-x86-config = { path = "../x86-config" }

[build-dependencies]
relocade-x86 = { path = "../x86" }
relocade-workers = { path = "../workers" }
relocade-compiler = { path = "../compiler", features = ["workers"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
jobserver = "=0.1.35"
pollster = "=1.0.1"
