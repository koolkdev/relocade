[package]
name = "relocade-vga"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
renderer = ["dep:futures-timer", "dep:relocade-renderer", "dep:web-time", "dep:wgpu"]

[dependencies]
arc-swap = "=1.9.3"
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"], optional = true }
relocade-machine = { path = "../machine" }
relocade-renderer = { path = "../renderer", optional = true }
web-time = { version = "=1.1.0", optional = true }
wgpu = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[dev-dependencies]
futures-channel = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"
