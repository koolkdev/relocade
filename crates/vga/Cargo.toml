[package]
name = "relocade-vga"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Avoid blocking mutex operations when a browser main thread waits for a frame.
event-listener = { version = "=5.4.1", default-features = false }
arc-swap = "=1.9.3"
relocade-machine = { path = "../machine" }
futures-lite = { version = "=2.6.1", default-features = false }

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
