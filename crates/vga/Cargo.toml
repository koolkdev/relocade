[package]
name = "relocade-vga"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
renderer = ["dep:relocade-renderer", "dep:relocade-peripherals", "dep:wgpu"]

[dependencies]
# Avoid blocking mutex operations when a browser main thread waits for a frame.
event-listener = { version = "=5.4.1", default-features = false }
arc-swap = "=1.9.3"
relocade-machine = { path = "../machine" }
relocade-renderer = { path = "../renderer", optional = true }
relocade-peripherals = { path = "../peripherals", features = ["display"], optional = true }
wgpu = { workspace = true, optional = true }
futures-lite = { version = "=2.6.1", default-features = false }

[dev-dependencies]
futures-channel = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
