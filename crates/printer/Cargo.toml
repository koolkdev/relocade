[package]
name = "relocade-printer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel = { version = "=2.5.0", default-features = false }
futures-channel = "=0.3.34"
futures-lite = "=2.6.1"
miniz_oxide = "=0.9.1"
pdf-writer = "=0.15.0"
relocade-machine = { path = "../machine" }
relocade-parallel = { path = "../parallel" }
relocade-vga = { path = "../vga" }

[dev-dependencies]
relocade-clock-test-support = { path = "../../tests/clock-support" }
relocade-pc = { path = "../pc" }
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
