[package]
name = "relocade-pc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relocade-ps2 = { path = "../ps2" }
relocade-bios = { path = "../bios" }
relocade-frontend = { path = "../frontend", features = ["keyboard"] }
relocade-machine = { path = "../machine" }
relocade-pc-speaker = { path = "../pc-speaker" }
relocade-pic = { path = "../pic" }
relocade-pit = { path = "../pit" }
relocade-vga = { path = "../vga" }
relocade-x86 = { path = "../x86" }

[dev-dependencies]
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
