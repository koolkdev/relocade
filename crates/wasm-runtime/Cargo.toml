[package]
name = "relocade-wasm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
worker = ["dep:relocade-derive", "dep:web-thread"]

[dependencies]
relocade-derive = { path = "../derive", optional = true }
relocade-wasm-bindings = { path = "../wasm-bindings" }
relocade-compiler = { path = "../compiler" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
web-thread = { package = "web-thread-select", version = "=0.2.0", features = ["web"], optional = true }

[dev-dependencies]
futures-channel = "=0.3.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true, features = ["cache"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-encoder.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
