[package]
name = "relocade-machine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relocade-time = { path = "../time" }
relocade-derive = { path = "../derive" }
futures-channel = "=0.3.34"
futures-lite = { version = "=2.6.1", default-features = false }
web-time = "=1.1.0"
wasmparser = { version = "=0.224.1", default-features = false }
relocade-wasm-runtime = { path = "../wasm-runtime" }
relocade-workers = { path = "../workers" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
relocade-interpreter = { path = "../interpreter" }
relocade-x86 = { path = "../x86" }
relocade-compiler = { path = "../compiler", features = ["workers"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

[dev-dependencies]
wasm-encoder.workspace = true
relocade-clock-test-support = { path = "../../tests/clock-support" }
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
