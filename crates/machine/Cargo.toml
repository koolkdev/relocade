[package]
name = "relocade-machine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
worker = ["relocade-wasm-runtime/worker"]

[dependencies]
relocade-wasm-runtime = { path = "../wasm-runtime" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
relocade-interpreter = { path = "../interpreter" }
relocade-x86 = { path = "../x86" }
relocade-compiler = { path = "../compiler" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }
relocade-x86 = { path = "../x86", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
