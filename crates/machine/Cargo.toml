[package]
name = "relocade-machine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
worker = ["relocade-wasm-runtime/worker"]

[dependencies]
futures-channel = "=0.3.34"
futures-lite = { version = "=2.6.1", default-features = false }
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }
web-time = "=1.1.0"
relocade-wasm-runtime = { path = "../wasm-runtime" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
relocade-interpreter = { path = "../interpreter" }
relocade-x86 = { path = "../x86" }
relocade-compiler = { path = "../compiler" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
