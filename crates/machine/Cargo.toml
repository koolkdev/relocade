[package]
name = "relocade-machine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relocade-derive = { path = "../derive" }
futures-channel = "=0.3.34"
futures-lite = { version = "=2.6.1", default-features = false }
web-time = "=1.1.0"
relocade-wasm-runtime = { path = "../wasm-runtime" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
relocade-interpreter = { path = "../interpreter" }
relocade-x86 = { path = "../x86" }
relocade-compiler = { path = "../compiler" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
