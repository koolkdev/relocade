[package]
name = "relocade-workers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
compiler = ["dep:relocade-compiler"]

[dependencies]
relocade-derive = { path = "../derive" }
relocade-compiler = { path = "../compiler", optional = true }
futures-channel = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
web-thread = { package = "web-thread-select", version = "=0.2.0", features = ["web"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.79"
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["MessageChannel", "MessageEvent", "MessagePort"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
