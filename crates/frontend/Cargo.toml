[package]
name = "relocade-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
display = ["dep:relocade-renderer", "dep:wgpu"]
keyboard = ["dep:futures-channel", "dep:winit"]

[dependencies]
relocade-renderer = { path = "../renderer", optional = true }
wgpu = { workspace = true, optional = true }
futures-channel = { version = "=0.3.34", optional = true }
winit = { version = "=0.30.13", optional = true }
