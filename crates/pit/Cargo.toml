[package]
name = "relocade-pit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
event-listener = { version = "=5.4.1", default-features = false }
futures-lite = { version = "=2.6.1", default-features = false }
relocade-pic = { path = "../pic" }
relocade-machine = { path = "../machine" }

[dev-dependencies]
relocade-clock-test-support = { path = "../../tests/clock-support" }
futures-channel = "=0.3.34"
relocade-x86 = { path = "../x86" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
