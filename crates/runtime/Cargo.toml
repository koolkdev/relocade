[package]
name = "relocade-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
worker = ["dep:web-thread", "dep:serde"]

[dependencies]
web-thread = { package = "web-thread-select", version = "=0.2.0", features = ["web"], optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
relocade-interpreter = { path = "../interpreter" }
relocade-machine = { path = "../machine" }
relocade-x86 = { path = "../x86" }
relocade-compiler = { path = "../compiler" }
