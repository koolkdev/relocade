<!doctype html>
<meta charset="utf-8">
<title>Relocade browser tests</title>
<link rel="icon" href="data:,">
<button id="run" disabled>Run tests</button>
<pre id="output">Loading Wasm tests…</pre>
<script type="module">
    const parameters = new URLSearchParams(location.search);
    const output = document.querySelector("#output");

    async function runInWorker(options) {
        const worker = new Worker(new URL("./wasm-test-worker.mjs", import.meta.url), { type: "module" });
        try {
            await new Promise((resolve, reject) => {
                worker.onmessage = ({ data }) => {
                    if ("line" in data) output.append(data.line, "\n");
                    else if ("error" in data) reject(new Error(data.error));
                    else if (data.done) resolve();
                };
                worker.onerror = event => reject(event.error ?? new Error(event.message));
                worker.onmessageerror = () => reject(new Error("Could not read test worker response"));
                worker.postMessage(options);
            });
        } finally {
            worker.terminate();
        }
    }

    // Initialize page suites before the click so DOM tests retain user activation.
    const runTests = parameters.has("worker")
        ? runInWorker
        : await (await import("./wasm-test-suite.mjs")).prepareTests();
    const run = document.querySelector("#run");
    run.onclick = () => {
        run.disabled = true;
        output.textContent = "";
        window.checks = runTests({
            names: JSON.parse(parameters.get("tests")),
            ignored: parameters.get("ignored") === "true",
        });
    };
    run.disabled = false;
    window.ready = true;
</script>
