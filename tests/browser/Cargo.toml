[package]
name = "relocade-browser-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-channel = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
relocade-wasm-runtime = { path = "../../crates/wasm-runtime" }
relocade-compiler = { path = "../../crates/compiler" }
relocade-machine = { path = "../../crates/machine", features = ["worker"] }
relocade-dos = { path = "../../crates/dos" }
relocade-vga = { path = "../../crates/vga" }
relocade-x86 = { path = "../../crates/x86" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "=1.0.1"
