<!doctype html>
<meta charset="utf-8">
<title>Relocade threaded runtime checks</title>
<link rel="icon" href="data:,">
<pre id="result">Running shared Rust thread checks…</pre>
<script type="module">
    import init, { run_checks } from "./pkg/relocade_threaded_runtime.js";
    const result = document.querySelector("#result");
    window.checks = (async () => {
        try {
            await init();
            await run_checks();
            result.textContent = "Shared Rust thread checks passed.";
        } catch (error) {
            result.textContent = `Thread checks failed: ${error}`;
            throw error;
        }
    })();
</script>
