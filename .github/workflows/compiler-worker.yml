name: Compiler worker

on:
  pull_request:
    paths:
      - "tests/compiler-worker/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/compiler-worker.yml"
  push:
    branches: [main]
    paths:
      - "tests/compiler-worker/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/compiler-worker.yml"

permissions:
  contents: read

concurrency:
  group: compiler-worker-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Compiler worker in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-20
          components: rust-src

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/compiler-worker/package-lock.json

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/threaded

      - name: Install Wasm bindings tool
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Run compiler worker checks
        working-directory: tests/compiler-worker
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm ci
          npm run build
          npm test
