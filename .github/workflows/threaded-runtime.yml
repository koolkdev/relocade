name: Threaded runtime experiment

on:
  pull_request:
    paths:
      - "examples/threaded-runtime/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/threaded-runtime.yml"
  push:
    branches: [main]
    paths:
      - "examples/threaded-runtime/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/threaded-runtime.yml"

permissions:
  contents: read

concurrency:
  group: threaded-runtime-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Shared Rust threads in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-20
          components: rust-src

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/threaded-runtime/package-lock.json

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/threaded

      - name: Install Wasm bindings tool
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Run shared Rust thread checks
        working-directory: examples/threaded-runtime
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm ci
          npm run build
          npm test
