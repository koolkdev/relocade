name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Core
            packages: >-
              -p relocade-derive -p relocade-compiler -p relocade-x86
              -p relocade-interpreter -p relocade-test-support
              -p relocade-wasm-bindings -p relocade-wasm-runtime
            system-packages: ''
          - suite: Machine and DOS
            packages: >-
              -p relocade-vfs -p relocade-machine -p relocade-bios -p relocade-dos
              -p relocade-vga -p relocade-pit -p relocade-pc-speaker
            system-packages: libvulkan1 mesa-vulkan-drivers libasound2-dev
          - suite: Native application
            packages: >-
              -p relocade-renderer -p relocade-frontend -p relocade-app
              -p relocade-dos-app -p relocade-browser-tests
            system-packages: libvulkan1 mesa-vulkan-drivers xvfb libxkbcommon-x11-0 libasound2-dev
    env:
      # Avoid LLVM's AVX-512 VPTERNLOG miscompile in llvmpipe.
      # Remove when CI's Mesa uses fixed LLVM: https://github.com/koolkdev/relocade/issues/638
      GALLIUM_OVERRIDE_CPU_CAPS: avx
      ALSA_CONFIG_PATH: ${{ github.workspace }}/crates/app/tests/alsa-null.conf
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure native test environment
        run: echo "XDG_RUNTIME_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install native test dependencies
        if: matrix.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.system-packages }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suite }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Cache compiled Wasm test modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}-

      - name: Run tests
        # Keep package selection and features identical when running ignored tests,
        # so Cargo can reuse this build instead of resolving another feature graph.
        run: cargo test ${{ matrix.packages }} --all-features --locked

      - name: Run display and audio integration tests
        if: matrix.suite == 'Native application'
        run: xvfb-run -a cargo test ${{ matrix.packages }} --all-features --locked -- --ignored

      - name: Check independent application features
        if: matrix.suite == 'Native application'
        run: |
          cargo check -p relocade-app --lib --locked
          cargo check -p relocade-app --lib --features audio --locked
          cargo check -p relocade-app --lib --features graphics --locked

  test:
    # Preserve the required check while reporting each native suite separately.
    name: Rust tests
    if: always()
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check native suites
        run: test "${{ needs.native.result }}" = success

  web:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/browser
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-20
          components: rust-src

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/browser/package-lock.json
            tools/package-lock.json

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/browser
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Wasm test runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Run browser tests
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm --prefix tests/browser ci
          npm --prefix tools ci
          npm --prefix tests/browser test
