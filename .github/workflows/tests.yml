name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install software graphics driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Cache compiled Wasm test modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-

      - name: Run workspace tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          cargo test --workspace --locked

  web:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      WASM_BINDGEN_TEST_TIMEOUT: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: runtime-web

      - name: Install Wasm test runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Run browser tests
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/webdriver.json
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ["WASM_BINDGEN_TEST_WEBDRIVER_JSON"], "w") as output:
              json.dump({"goog:chromeOptions": {
                  "binary": os.environ["CHROME_BINARY"],
                  "args": ["--enable-unsafe-webgpu", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"],
              }}, output)
          PY
          cargo test -p relocade-runtime-web -p relocade-renderer --target wasm32-unknown-unknown --tests --locked
