name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    name: Diagnose native GPU tests on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: 1
      GALLIUM_OVERRIDE_CPU_CAPS: avx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install diagnostics and identify graphics libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libvulkan1 mesa-vulkan-drivers libasound2-dev libxkbcommon-x11-0
          dpkg-query -W 'mesa-vulkan-drivers' 'libllvm*' 'libvulkan1'
          lscpu | grep -E 'Model name|CPU\(s\)|Vendor ID'
          ls -l /usr/share/vulkan/icd.d/ /opt/google/chrome/*icd*.json || true
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: Native integration
          save-if: 'false'
      - name: Build the three existing GPU integration suites
        run: |
          cargo test -p relocade-vga -p relocade-dos --all-features --locked --no-run --test gpu --test et4000 --test video_gpu --message-format=json > "$RUNNER_TEMP/gpu-bins.jsonl"
          jq -r 'select(.reason=="compiler-artifact" and .executable!=null) | "\(.target.name)=\(.executable)"' "$RUNNER_TEMP/gpu-bins.jsonl" >> "$GITHUB_ENV"
      - name: Capture the failing thread in the stock graphics test
        run: |
          export DEBUGINFOD_URLS=
          gdb -batch -q -ex 'set debuginfod enabled off' -ex 'set print thread-events off' -ex run -ex 'bt 24' -ex 'info symbol $pc' -ex 'info sharedlibrary' --args "$gpu" > "$RUNNER_TEMP/gpu-backtrace" 2>&1 || true
          grep -E -A28 'received signal|Program terminated|test result:|panicked at' "$RUNNER_TEMP/gpu-backtrace" | head -100 || true
          grep -E 'libvulkan|libLLVM|swrast|dri\.so|libgallium|libEGL' "$RUNNER_TEMP/gpu-backtrace" | tail -30 || true
      - name: Compare driver and CPU capability settings with the same binaries
        run: |
          shopt -s nullglob
          lvp=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          swift=(/opt/google/chrome/vk_swiftshader_icd.json)
          probe() {
            local variant=$1
            shift
            for suite in gpu et4000 video_gpu; do
              log="$RUNNER_TEMP/$variant-$suite.log"
              rc=0
              env "$@" MESA_SHADER_CACHE_DIR="$RUNNER_TEMP/mesa-$variant-$suite" "${!suite}" > "$log" 2>&1 || rc=$?
              echo "RESULT $variant $suite exit=$rc"
              grep -E 'test result:|FAILED|panicked at|LLVM ERROR|failed to' "$log" | tail -5 || true
            done
          }
          probe stock
          probe avx2 GALLIUM_OVERRIDE_CPU_CAPS=avx2
          probe native -u GALLIUM_OVERRIDE_CPU_CAPS
          if ((${#lvp[@]})); then probe lavapipe VK_DRIVER_FILES="${lvp[0]}"; fi
          probe serial RUST_TEST_THREADS=1
          probe one-llvmpipe-worker LP_NUM_THREADS=1
          if [[ -f ${swift[0]} ]]; then probe swiftshader VK_DRIVER_FILES="${swift[0]}"; fi
