name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    name: Install Ubuntu's fixed Vulkan loader on 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Install the native job's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb libxkbcommon-x11-0 libasound2-dev vulkan-tools
          dpkg-query -W libvulkan1 libc6 mesa-vulkan-drivers
          dpkg-query -W -f='\${binary:Package} \${db:Status-Status}\n' 'libvulkan*' || true
      - name: Upgrade the loader from the Ubuntu snapshot
        run: |
          deb="$RUNNER_TEMP/libvulkan1.deb"
          /usr/lib/apt/apt-helper download-file \
            https://snapshot.ubuntu.com/ubuntu/20261101T000000Z/pool/main/v/vulkan-loader/libvulkan1_1.4.357.0-1_amd64.deb \
            "$deb" SHA256:3c17e31048e961d9801744f83eacca3c1f60af67666e6ff24bd919bd761cd8ec
          sudo apt-get install -y --no-remove "$deb"
          dpkg-query -W libvulkan1 libc6 mesa-vulkan-drivers
          test "$(dpkg-query -W -f='${Version}' libvulkan1)" = 1.4.357.0-1
      - name: Enumerate Vulkan drivers
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          vulkaninfo --summary
