name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install software graphics driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb libxkbcommon-x11-0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Cache compiled Wasm test modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-

      - name: Run workspace tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          cargo test --workspace --locked
          cargo test -p relocade-app --features graphics --test redraw --locked
          xvfb-run -a cargo test -p relocade-app --test window --locked -- --ignored
          xvfb-run -a cargo test -p relocade-app --features graphics --test surface --locked -- --ignored
          xvfb-run -a cargo test -p relocade-dos-app --test window --locked -- --ignored

  web:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/browser
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-20
          components: rust-src

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/browser

      - name: Install Wasm test runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Run browser tests
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm --prefix tests/browser ci
          npm --prefix tests/browser test
          node tests/browser/app-test.mjs
